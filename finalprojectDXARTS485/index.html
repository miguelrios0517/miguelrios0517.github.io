<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DXARTS 485 Final</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="intro-screen" class="screen active">
      <video controls id="intro-video" width="100%">
        <source src="dxartsfinalvideo.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <button id="start-video-btn">Start Video</button>
      <button class="hidden" id="skip-intro-btn">Skip/Start Game</button>
    </div>

    <div id="main-menu" class="screen">
      <h1>Peru's Gastronomic Boom</h1>
      <p>Exploring An Alternate Reality</p>
      <button id="start-game-btn">Start Game</button>
      <button id="how-to-play-btn">How to Play</button>
    </div>

    <div id="game-screen" class="screen">
      <div id="scene-container">
        <img id="scene-img" src="" alt="Restaurant Scene" class="scene-image" />

        <img
          id="persona-img"
          src=""
          alt="Character or Dish"
          class="persona-image"
        />

        <div id="speaker-name"></div>
      </div>

      <div id="dialogue-box">
        <p id="dialogue-text"></p>
        <div id="options-container"></div>
        <button id="next-dialogue-btn" class="hidden">Next &raquo;</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
